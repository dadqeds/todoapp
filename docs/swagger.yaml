  internal_features_users_transport_http.GetMeResponse:
    properties:
      full_name:
        example: Ivan Ivanov
        type: string
      id:
        example: 10
        type: integer
      is_admin:
        example: false
        type: boolean
      phone_number:
        example: "+79998887766"
        type: string
      telegram_id:
        example: 123456789
        type: integer
      timezone:
        example: Europe/Moscow
        type: string
      version:
        example: 3
        type: integer
    type: object
  internal_features_users_transport_http.GetUserResponse:
    properties:
      full_name:
        example: Ivan Ivanov
        type: string
      id:
        example: 10
        type: integer
      phone_number:
        example: "+79998887766"
        type: string
      telegram_id:
        example: 123456789
        type: integer
      timezone:
        example: Europe/Moscow
        type: string
      version:
        example: 3
        type: integer
