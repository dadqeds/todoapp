info:
  contact: {}
  description: Todo Application REST-API scheme
  title: Golang Todo API
  version: "1.0"
paths:
  /lists:
    get:
      description: Свои и общие списки текущего пользователя со счётчиками, ролью
        и участниками. Список по умолчанию идёт первым и создаётся автоматически.
        Администратор может передать user_id
      parameters:
      - description: Чьи списки показать (только для администратора)
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_features_lists_transport_http.ListSummaryDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Нет или неверные данные Telegram
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - TelegramInitData: []
      summary: Мои списки
      tags:
      - lists
    post:
      consumes:
      - application/json
      parameters:
      - description: Новый список
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_lists_transport_http.CreateListRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_features_lists_transport_http.ListDTOResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Нет или неверные данные Telegram
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - TelegramInitData: []
      summary: Создать список
      tags:
      - lists
  /lists/{id}:
    delete:
      description: Удаляет список вместе со всеми его задачами, только владелец (участнику
        — 403). Список по умолчанию удалить нельзя (409)
      parameters:
      - description: ID списка
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Список удалён
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Нет или неверные данные Telegram
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Список по умолчанию
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - TelegramInitData: []
      summary: Удалить список
      tags:
      - lists
    patch:
      consumes:
      - application/json
      description: Название и цвет, только владелец (участнику — 403). Необязательное
        поле 'version' защищает от одновременного изменения (409)
      parameters:
      - description: ID списка
        in: path
        name: id
        required: true
        type: integer
      - description: Изменения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_lists_transport_http.PatchListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_lists_transport_http.ListDTOResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Нет или неверные данные Telegram
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - TelegramInitData: []
      summary: Изменить список
      tags:
      - lists
  /lists/{id}/invite:
    delete:
      description: Ссылка перестаёт работать, уже вступившие остаются. Только владелец
      parameters:
      - description: ID списка
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Приглашение выключено
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Нет или неверные данные Telegram
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Не владелец
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - TelegramInitData: []
      summary: Выключить приглашение
      tags:
      - lists
    post:
      description: Выдаёт новый код приглашения (прежняя ссылка перестаёт работать).
        Только владелец. Список по умолчанию расшарить нельзя (409). invite_link заполняется,
        если задан AUTH_TELEGRAM_BOT_USERNAME
      parameters:
      - description: ID списка
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_lists_transport_http.ListDTOResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Нет или неверные данные Telegram
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Не владелец
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Список по умолчанию
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - TelegramInitData: []
      summary: Ссылка-приглашение в список
      tags:
      - lists
  /lists/{id}/members/{user_id}:
    delete:
      description: Участник может удалить себя (выйти), владелец — любого участника.
        Владелец выйти не может (409)
      parameters:
      - description: ID списка
        in: path
        name: id
        required: true
        type: integer
      - description: ID участника
        in: path
        name: user_id
        required: true
        type: integer
      responses:
        "204":
          description: Участник удалён из списка
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Нет или неверные данные Telegram
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "403":
          description: Не владелец
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Владелец не может выйти
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - TelegramInitData: []
      summary: Исключить участника или выйти из списка
      tags:
      - lists
  /lists/join:
    post:
      consumes:
      - application/json
      description: Код берётся из ссылки t.me/<бот>?startapp=join_<код>. Повторное
        вступление ничего не меняет
      parameters:
      - description: Код приглашения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_lists_transport_http.JoinListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_lists_transport_http.ListDTOResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Нет или неверные данные Telegram
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Приглашение не найдено или выключено
          schema:
            $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse'
      security:
      - TelegramInitData: []
      summary: Вступить в список по приглашению
      tags:
      - lists
  /me:
    get:
