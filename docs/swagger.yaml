basePath: /api/v1
definitions:
  github_com_dadqeds_todoapp_internal_core_transport_http_response.ErrorResponse:
    properties:
      error:
        example: full error text
        type: string
      message:
        example: short human-readable message
        type: string
    type: object
  github_com_dadqeds_todoapp_internal_core_transport_http_types.Nullable-internal_features_tasks_transport_http_RepeatDTO:
    properties:
      set:
        type: boolean
      value:
        $ref: '#/definitions/internal_features_tasks_transport_http.RepeatDTO'
    type: object
  internal_features_lists_transport_http.CreateListRequest:
    properties:
      color:
        enum:
        - green
        - violet
        - coral
        - blue
        - pink
        - amber
        example: green
        type: string
      title:
        example: Дом
        maxLength: 50
        minLength: 1
        type: string
    required:
    - color
    - title
    type: object
  internal_features_lists_transport_http.JoinListRequest:
    properties:
      code:
        example: pQ3x_Zr8k1LmN0aB
        maxLength: 32
        minLength: 8
        type: string
    required:
    - code
    type: object
  internal_features_lists_transport_http.ListDTOResponse:
    properties:
      color:
        enum:
        - green
        - violet
        - coral
        - blue
        - pink
        - amber
        example: green
        type: string
      created_at:
        type: string
      id:
        example: 3
        type: integer
      invite_code:
        description: 'Только для владельца: код и ссылка приглашения, null — приглашение
          выключено.'
        example: pQ3x_Zr8k1LmN0aB
        type: string
      invite_link:
        example: https://t.me/my_todo_bot?startapp=join_pQ3x_Zr8k1LmN0aB
        type: string
      is_default:
        example: false
        type: boolean
      owner_user_id:
        example: 1
        type: integer
      title:
        example: Дом
        type: string
      version:
        example: 1
        type: integer
    type: object
  internal_features_lists_transport_http.ListMemberDTO:
    properties:
      full_name:
        example: Анна
        type: string
      joined_at:
        type: string
      role:
        enum:
        - owner
        - member
        example: member
        type: string
      user_id:
        example: 7
        type: integer
    type: object
  internal_features_lists_transport_http.ListSummaryDTOResponse:
    properties:
      color:
        enum:
        - green
        - violet
        - coral
        - blue
        - pink
        - amber
        example: green
        type: string
      created_at:
        type: string
      id:
        example: 3
        type: integer
      invite_code:
        description: 'Только для владельца: код и ссылка приглашения, null — приглашение
          выключено.'
        example: pQ3x_Zr8k1LmN0aB
        type: string
      invite_link:
        example: https://t.me/my_todo_bot?startapp=join_pQ3x_Zr8k1LmN0aB
        type: string
      is_default:
        example: false
        type: boolean
      members:
        items:
          $ref: '#/definitions/internal_features_lists_transport_http.ListMemberDTO'
        type: array
      open_tasks:
        example: 3
        type: integer
      owner_user_id:
        example: 1
        type: integer
      role:
        enum:
        - owner
        - member
        example: owner
        type: string
      title:
        example: Дом
        type: string
      total_tasks:
        example: 5
        type: integer
      version:
        example: 1
        type: integer
    type: object
  internal_features_lists_transport_http.PatchListRequest:
    properties:
      color:
        example: amber
        type: string
      title:
        example: Дача
        type: string
      version:
        example: 1
        type: integer
    type: object
  internal_features_statistics_transport_http.GetStatisticsResponse:
    properties:
      lists:
        items:
          $ref: '#/definitions/internal_features_statistics_transport_http.ListStatisticsResponse'
        type: array
      tasks_average_completion_seconds:
        description: Секунды — чтобы фронт мог показать «1 день 4 ч», а не разбирать
          строку Go.
        example: 90
        type: integer
      tasks_average_completion_time:
        example: 1m30s
        type: string
      tasks_completed:
        example: 10
        type: integer
      tasks_completed_on_time:
        example: 5
        type: integer
      tasks_completed_rate:
        example: 20
        type: number
      tasks_completed_with_due:
        example: 6
        type: integer
      tasks_created:
        example: 50
        type: integer
      tasks_on_time_rate:
        example: 83.3
        type: number
    type: object
  internal_features_statistics_transport_http.ListStatisticsResponse:
    properties:
      color:
        example: green
        type: string
      list_id:
        example: 3
        type: integer
      tasks_completed:
        example: 7
        type: integer
      tasks_created:
        example: 9
        type: integer
      title:
        example: Дом
        type: string
    type: object
  internal_features_tasks_transport_http.CreateTaskRequest:
    properties:
      author_user_id:
        description: Учитывается только для администратора, остальным автором ставится
          текущий пользователь.
        example: 1
        minimum: 1
        type: integer
      description:
        example: 2 литра, 3.2%
        maxLength: 1000
        minLength: 1
        type: string
      due_all_day:
        example: false
        type: boolean
      due_at:
        description: Срок с часовым поясом. Для срока «на весь день» — конец дня по
          времени пользователя.
        example: "2026-10-05T18:00:00+03:00"
        type: string
      list_id:
        description: Не указан — список по умолчанию автора.
        example: 3
        minimum: 1
        type: integer
      repeat:
        allOf:
        - $ref: '#/definitions/internal_features_tasks_transport_http.RepeatDTO'
        description: Повтор требует срока.
      title:
        example: Купить молоко
        maxLength: 100
        minLength: 1
        type: string
    required:
    - title
    type: object
  internal_features_tasks_transport_http.CreateTaskResponse:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      due_all_day:
        type: boolean
      due_at:
        type: string
      id:
        type: integer
      list_id:
        type: integer
      repeat:
        $ref: '#/definitions/internal_features_tasks_transport_http.RepeatDTO'
      title:
        type: string
      version:
        type: integer
    type: object
  internal_features_tasks_transport_http.GetTaskResponse:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      due_all_day:
        type: boolean
      due_at:
        type: string
      id:
        type: integer
      list_id:
        type: integer
      repeat:
        $ref: '#/definitions/internal_features_tasks_transport_http.RepeatDTO'
      title:
        type: string
      version:
        type: integer
    type: object
  internal_features_tasks_transport_http.PatchTaskRequest:
    properties:
      completed:
        example: true
        type: boolean
      description:
        example: 2 литра
        type: string
      due_all_day:
        example: false
        type: boolean
      due_at:
        description: null снимает срок
        example: "2026-10-06T10:00:00+03:00"
        type: string
      list_id:
        example: 3
        type: integer
      repeat:
        allOf:
        - $ref: '#/definitions/github_com_dadqeds_todoapp_internal_core_transport_http_types.Nullable-internal_features_tasks_transport_http_RepeatDTO'
        description: null выключает повтор
      title:
        example: Купить молоко
        type: string
      version:
        example: 3
        type: integer
    type: object
  internal_features_tasks_transport_http.PatchTaskResponse:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      due_all_day:
        type: boolean
      due_at:
        type: string
      id:
        type: integer
      list_id:
        type: integer
      repeat:
        $ref: '#/definitions/internal_features_tasks_transport_http.RepeatDTO'
      title:
        type: string
      version:
        type: integer
    type: object
  internal_features_tasks_transport_http.RepeatDTO:
    properties:
      kind:
        enum:
        - daily
        - weekly
        - monthly
        - yearly
        example: weekly
        type: string
      weekdays:
        example:
        - 1
        - 4
        items:
          type: integer
        type: array
    type: object
  internal_features_tasks_transport_http.TaskDTOResponse:
    properties:
      author_user_id:
        type: integer
      completed:
        type: boolean
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      due_all_day:
        type: boolean
      due_at:
        type: string
      id:
        type: integer
      list_id:
        type: integer
      repeat:
        $ref: '#/definitions/internal_features_tasks_transport_http.RepeatDTO'
      title:
        type: string
      version:
        type: integer
    type: object
  internal_features_users_transport_http.CreateUserRequest:
    properties:
      full_name:
        example: Ivan Ivanov
        maxLength: 100
        minLength: 1
        type: string
      phone_number:
        example: "+79998887766"
        maxLength: 15
        minLength: 10
        type: string
    required:
    - full_name
    type: object
  internal_features_users_transport_http.CreateUserResponse:
    properties:
      full_name:
        example: Ivan Ivanov
        type: string
      id:
        example: 10
        type: integer
      phone_number:
        example: "+79998887766"
        type: string
      telegram_id:
        example: 123456789
        type: integer
      timezone:
        example: Europe/Moscow
        type: string
      version:
        example: 3
        type: integer
