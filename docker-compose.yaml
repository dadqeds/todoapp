services:
  todoapp:
    build:
      context: ${PROJECT_ROOT:-.}
      dockerfile: ${PROJECT_ROOT:-.}/cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT:-30s}
      - HTTP_CORS_ALLOWED_ORIGINS=${HTTP_CORS_ALLOWED_ORIGINS:-}
      - HTTP_SWAGGER_ENABLED=${HTTP_SWAGGER_ENABLED:-false}
      - AUTH_TELEGRAM_BOT_TOKEN=${AUTH_TELEGRAM_BOT_TOKEN:-}
      - AUTH_TELEGRAM_BOT_USERNAME=${AUTH_TELEGRAM_BOT_USERNAME:-}
      - AUTH_INIT_DATA_MAX_AGE=${AUTH_INIT_DATA_MAX_AGE:-24h}
      - AUTH_ADMIN_TELEGRAM_IDS=${AUTH_ADMIN_TELEGRAM_IDS:-}
      - AUTH_LOCAL_ADDR=:5051
      - AUTH_LOCAL_TELEGRAM_ID=${AUTH_LOCAL_TELEGRAM_ID}
      - POSTGRES_HOST=todoapp-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT:-.}/out/logs:/app/out/logs
    ports:
      # Оба порта только на 127.0.0.1: 5050 — для туннеля к Telegram,
      # 5051 — локальный вход без Telegram, наружу его не пробрасывать.
      - "127.0.0.1:5050:5050"
      - "127.0.0.1:5051:5051"
    depends_on:
      todoapp-postgres:
        condition: service_healthy
    restart: "always"
  todoapp-postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT:-.}/out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT:-.}/migrations:/migrations
    depends_on:
      todoapp-postgres:
        condition: service_healthy

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
  swagger:
    build:
      context: ${PROJECT_ROOT:-.}
      dockerfile_inline: |
        FROM golang:1.25.1-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT:-.}:/code
