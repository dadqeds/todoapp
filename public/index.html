<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Мои задачи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <main class="screen" id="screen"></main>

    <div class="action-bar" id="actionBar" hidden>
      <button class="btn primary block" id="addTaskBtn" type="button"></button>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Разделы">
      <button type="button" data-tab="tasks"></button>
      <button type="button" data-tab="stats"></button>
      <button type="button" data-tab="profile"></button>
    </nav>

    <div class="sheet-backdrop" id="sheetBackdrop">
      <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
    </div>

    <div class="toasts" id="toasts"></div>

    <script src="/assets/app.js"></script>
  </body>
</html>
