<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 11l3 3L20 6" />
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <path d="M3 12h2M12 3v2M21 12h-2M12 21v-2" />
            </svg>
          </div>
          <div class="brand-name">TodoApp</div>
          <div class="badge">v1</div>
        </div>
        <div class="me-name" id="meName"></div>
        <div class="nav-title">Навигация</div>
        <nav class="nav">
          <button data-page="tasks" class="active">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M9 11l2 2 4-4" />
              <rect x="4" y="4" width="16" height="16" rx="2" />
              <path d="M8 4V2M16 4V2" /></svg
            ><span>Задачи</span>
          </button>
          <button data-page="users">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="9" cy="8" r="3" />
              <path d="M3 20c.8-3.8 3-6 6-6s5.2 2.2 6 6" />
              <path d="M15 5.5a3 3 0 010 5.9M17 14c2.2.6 3.5 2.2 4 5" /></svg
            ><span>Пользователи</span>
          </button>
          <button data-page="stats">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M5 20V10M12 20V4M19 20v-7" /></svg
            ><span>Статистика</span>
          </button>
        </nav>
        <div class="theme-box">
          <div class="theme-left">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              /></svg
            >Light mode
          </div>
          <button class="switch" id="themeSwitch" aria-label="Переключить тему">
            <span></span>
          </button>
        </div>
      </aside>
      <main class="main" id="main"></main>
    </div>
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
    </div>
    <div class="toast-wrap" id="toasts"></div>
    <script src="/assets/app.js"></script>
  </body>
</html>
